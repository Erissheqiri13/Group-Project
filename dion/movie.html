<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="detail-container">

    <h1 id="movieTitle">Loading...</h1>

    <div class="detail-box">

      <img id="movieImg" src="" alt="Movie">

      <div class="info">
        <p id="movieDesc">
          This is a movie page. You can later add description, rating, and trailer here.
        </p>

        <button onclick="goBack()">⬅ Back</button>
      </div>

    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title");

    document.getElementById("movieTitle").innerText = title;

    const imgMap = {
      "The Adam Project": "photos/theadam.jpg",
      "The Killer": "photos/thekiller.jpg",
      "The Platform": "photos/theplatform.jpg",
      "Extraction": "photos/extractions.jpg",
      "Extraction 2": "photos/extraction2.jpg",
      "All Quiet on the Western Front": "photos/allquiet.jpg",
      "Beasts of No Nation": "photos/beastofnonation.jpg",
      "Bird Box": "photos/bird.jpg",
      "I Care a Lot": "photos/care.jpg",
      "Carry-On": "photos/carry.jpg"
    };

    document.getElementById("movieImg").src =
      imgMap[title] || "photos/allquiet.jpg";

    function goBack() {
      window.history.back();
    }
  </script>

</body>
</html>
