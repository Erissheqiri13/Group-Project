<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illyrium Cinema - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contact-card">

        <div class="left-side">

            <h2>Let's Connect</h2>

            <p>
                We're here to help. Reach out with any questions,
                feedback, or support requests regarding
                Illyrium Cinema.
            </p>

            <div class="contact-info">
                <h3>Email</h3>
                <span>support@illyriumcinema.com</span>
            </div>

            <div class="contact-info">
                <h3>Phone</h3>
                <span>+383 44 123 456</span>
            </div>

            <div class="contact-info">
                <h3>Location</h3>
                <span>Prishtina, Kosovo</span>
            </div>

        </div>

        <div class="right-side">

            <h1>Contact Us</h1>

            <form id="contactForm">

                <div class="row">

                    <input
                        type="text"
                        placeholder="Full Name"
                        required
                    >

                    <input
                        type="email"
                        placeholder="Email Address"
                        required
                    >

                </div>

                <input
                    type="text"
                    placeholder="Subject"
                    required
                >

                <textarea
                    placeholder="Write your message..."
                    required
                ></textarea>

                <button type="submit">
                    Send Message
                </button>

                <div id="successMessage"></div>

            </form>

        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
